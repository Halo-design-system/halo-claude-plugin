name: Sync

# Copies plugins/halo-ds from the main branch of the main Halo repository.
# Runs daily, or by hand from the Actions tab.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy the plugin
        run: |
          git clone --depth 1 https://github.com/Halo-design-system/Halo-design-system.git /tmp/halo
          rsync -a --delete --exclude LICENSE /tmp/halo/plugins/halo-ds/ plugins/halo-ds/

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already matches main"
          else
            git commit -m "Sync plugin from Halo main"
            git push
          fi
